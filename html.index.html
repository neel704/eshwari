<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farewell Eshwari Kadam 🚀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Courier New', monospace;
    min-height:100vh;
    overflow-x:hidden;

    background:linear-gradient(
        135deg,
        #ffd6e8,
        #fff0c9,
        #d6f0ff,
        #ffe0f7
    );

    background-size:400% 400%;
    animation:bgMove 12s ease infinite;

    text-align:center;
    padding:20px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Balloons */

.balloon{
    position:fixed;
    font-size:50px;
    animation:float 5s infinite ease-in-out;
    opacity:.9;
    z-index:1;
    pointer-events:none;
}

.b1{left:5%;top:10%;}
.b2{right:8%;top:15%;animation-delay:1s;}
.b3{left:12%;bottom:10%;animation-delay:2s;}
.b4{right:12%;bottom:15%;animation-delay:3s;}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }
    50%{
        transform:translateY(-35px) rotate(5deg);
    }
}

/* Flowers */

.flower{
    position:fixed;
    font-size:60px;
    z-index:1;
    animation:flowerFloat 4s infinite ease-in-out;
    pointer-events:none;
}

.f1{top:20px;left:20px;}
.f2{top:20px;right:20px;animation-delay:1s;}
.f3{bottom:20px;left:20px;animation-delay:2s;}
.f4{bottom:20px;right:20px;animation-delay:3s;}

@keyframes flowerFloat{
    0%,100%{
        transform:scale(1) rotate(0deg);
    }
    50%{
        transform:scale(1.15) rotate(10deg);
    }
}

/* Main Container */

.container{
    max-width:800px;
    margin:0 auto;
    position:relative;
    z-index:2;
}

/* Title */

h1{
    margin-top:40px;
    line-height:1.1;

    font-size:clamp(2.5rem,8vw,4.5rem);

    background:linear-gradient(
        90deg,
        #ff1493,
        #8a2be2,
        #ff4500,
        #ff1493
    );

    background-size:300% auto;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:titleGlow 4s linear infinite;

    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 20px rgba(255,105,180,.5);
}

@keyframes titleGlow{
    0%{
        background-position:0% center;
    }
    100%{
        background-position:300% center;
    }
}

/* Subtitle */

.subtitle{
    margin-top:15px;
    color:#d63384;
    font-size:22px;
    font-weight:bold;

    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

/* Countdown */

#countdown{
    display:none;

    margin:30px auto 10px;

    font-size:80px;
    font-weight:bold;

    color:#ff1493;

    text-shadow:
        0 0 10px white,
        0 0 30px #ff69b4;

    animation:countdownPop .8s ease;
}

@keyframes countdownPop{
    0%{
        transform:scale(2);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* Button */

button{
    margin-top:35px;

    padding:16px 35px;

    border:none;
    border-radius:50px;

    background:linear-gradient(
        90deg,
        #ff1493,
        #ff69b4,
        #ff1493
    );

    background-size:200% auto;

    color:white;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(255,20,147,.4);

    transition:.3s;

    animation:buttonGlow 2s infinite;
}

button:hover{
    transform:scale(1.08);
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

@keyframes buttonGlow{
    0%,100%{
        box-shadow:0 10px 30px rgba(255,20,147,.4);
    }
    50%{
        box-shadow:
            0 10px 45px rgba(255,20,147,.8);
    }
}

/* Music Button */

.music-control{
    margin-top:15px;

    padding:10px 20px;

    font-size:16px;

    background:#8a2be2;

    animation:none;
}

/* Message Box */

#message{

    width:min(90%,700px);

    margin:35px auto;

    text-align:center;

    white-space:pre-wrap;

    font-size:18px;
    line-height:1.8;

    padding:25px;

    border-radius:25px;

    background:rgba(255,255,255,.88);

    backdrop-filter:blur(10px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.15);

    overflow-wrap:break-word;

    min-height:50px;
}

/* Message Animation */

.messageShow{
    animation:
        messageAppear 1.5s ease,
        messageGlow 3s infinite alternate;
}

@keyframes messageAppear{
    from{
        opacity:0;
        transform:translateY(50px) scale(.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes messageGlow{
    from{
        box-shadow:
            0 10px 40px rgba(255,20,147,.15);
    }
    to{
        box-shadow:
            0 10px 50px rgba(255,20,147,.4);
    }
}

/* Cursor */

.cursor{
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* Confetti */

.confetti{
    position:fixed;

    width:10px;
    height:10px;

    top:-20px;

    z-index:100;

    animation:confettiFall linear forwards;

    pointer-events:none;
}

@keyframes confettiFall{

    0%{
        transform:
            translateY(-20px)
            rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(720deg);
        opacity:0;
    }
}

/* Floating Hearts */

.heart{
    position:fixed;

    bottom:-50px;

    font-size:25px;

    z-index:5;

    pointer-events:none;

    animation:heartRise 5s linear forwards;
}

@keyframes heartRise{

    0%{
        transform:
            translateY(0)
            scale(.5);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-110vh)
            scale(1.5)
            rotate(20deg);
        opacity:0;
    }
}

/* Mobile */

@media(max-width:768px){

    h1{
        font-size:2.8rem;
    }

    .subtitle{
        font-size:18px;
    }

    #countdown{
        font-size:60px;
    }

    button{
        width:90%;
        max-width:320px;
        font-size:18px;
    }

    #message{
        width:95%;
        padding:18px;
        font-size:15px;
        line-height:1.6;
    }

    .balloon{
        font-size:35px;
    }

    .flower{
        font-size:40px;
    }
}

</style>
</head>

<body>

<!-- Balloons -->

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>

<!-- Flowers -->

<div class="flower f1">🌸</div>
<div class="flower f2">🌹</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌷</div>


<div class="container">

<h1>
🌸 Farewell,<br>
Eshwari Kadam! 🚀
</h1>

<div class="subtitle">
💖 A special message is waiting for you... 💖
</div>

<!-- Countdown -->

<div id="countdown">10</div>

<!-- Unlock Button -->

<button id="unlockBtn" onclick="startCountdown()">
🔓 Unlock Farewell Message
</button>

<br>

<!-- Music Control -->

<button
    id="musicBtn"
    class="music-control"
    onclick="toggleMusic()"
>
🎵 Music: OFF
</button>

<!-- Message -->

<div id="message"></div>

</div>


<!-- Background Music -->

<audio id="bgMusic" loop>
    <source src="farewell-music.mp3" type="audio/mpeg">
</audio>


<script>

/* =========================================
   FAREWELL MESSAGE
========================================= */

const text = `

🌸 Farewell, Eshwari Kadam! 🚀 🌸

Thank you for being an amazing colleague and Mothii TAI ❤️

Your hard work, positivity, and dedication
have inspired everyone around you and made
a lasting impact on our team.

As you begin this exciting new chapter,
may success follow you wherever you go.

💜 May you achieve all your goals.
💙 May you create wonderful memories.
💚 May you embrace new opportunities.
🧡 May you reach even greater heights in your career.

Best of luck for your new journey!

You are leaving this company,
but the memories and friendships you created
will always remain with us.

❤️ We will miss you, Eshwari Kadam!

✨ System Status ✨

Friendship : ACTIVE ❤️
Memories : STORED FOREVER 📸
Success : LOADING... ∞% 🚀
Happiness : LOADING... ∞% 😊
Future : BRIGHT ✨

❤️ From Your Team 3DI ❤️
(3 Dimensional Immersive)
`;


/* =========================================
   VARIABLES
========================================= */

let started = false;

let musicPlaying = false;

const music =
    document.getElementById("bgMusic");

const musicBtn =
    document.getElementById("musicBtn");

const countdown =
    document.getElementById("countdown");

const unlockBtn =
    document.getElementById("unlockBtn");

const message =
    document.getElementById("message");


/* =========================================
   COUNTDOWN
========================================= */

function startCountdown(){

    if(started) return;

    started = true;

    unlockBtn.disabled = true;

    unlockBtn.innerHTML =
        "✨ Get Ready... ✨";

    countdown.style.display = "block";

    let number = 10;

    countdown.innerHTML = number;

    /* Start music */

    music.play()
        .then(() => {

            musicPlaying = true;

            musicBtn.innerHTML =
                "🎵 Music: ON";

        })
        .catch(() => {

            musicPlaying = false;

        });


    const timer = setInterval(() => {

        number--;

        countdown.innerHTML = number;

        /* Countdown animation */

        countdown.style.animation = "none";

        void countdown.offsetWidth;

        countdown.style.animation =
            "countdownPop .8s ease";


        if(number <= 0){

            clearInterval(timer);

            countdown.innerHTML = "💖";

            unlockBtn.style.display =
                "none";

            setTimeout(() => {

                countdown.style.display =
                    "none";

                showMessage();

                startConfetti();

                startHearts();

            },1000);
        }

    },1000);
}


/* =========================================
   TYPING EFFECT
========================================= */

function showMessage(){

    message.classList.add(
        "messageShow"
    );

    let i = 0;

    function type(){

        if(i < text.length){

            message.innerHTML =
                text.substring(0,i+1) +
                '<span class="cursor">|</span>';

            i++;

            setTimeout(type,25);

        }else{

            message.innerHTML = text;

        }

    }

    type();
}


/* =========================================
   MUSIC CONTROL
========================================= */

function toggleMusic(){

    if(musicPlaying){

        music.pause();

        musicPlaying = false;

        musicBtn.innerHTML =
            "🎵 Music: OFF";

    }else{

        music.play()
            .then(() => {

                musicPlaying = true;

                musicBtn.innerHTML =
                    "🎵 Music: ON";

            })
            .catch(() => {

                alert(
                    "Please click the button again to start the music."
                );

            });

    }
}


/* =========================================
   CONFETTI
========================================= */

function startConfetti(){

    const colors = [
        "#ff1493",
        "#8a2be2",
        "#ff4500",
        "#00c9ff",
        "#ffd700",
        "#00ff88"
    ];

    for(let i = 0; i < 120; i++){

        const piece =
            document.createElement("div");

        piece.classList.add("confetti");

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        piece.style.animationDuration =
            (Math.random() * 3 + 2) + "s";

        piece.style.animationDelay =
            Math.random() * 2 + "s";

        piece.style.width =
            (Math.random() * 8 + 5) + "px";

        piece.style.height =
            (Math.random() * 8 + 5) + "px";

        document.body.appendChild(piece);

        setTimeout(() => {

            piece.remove();

        },6000);

    }
}


/* =========================================
   FLOATING HEARTS
========================================= */

function startHearts(){

    setInterval(() => {

        const heart =
            document.createElement("div");

        heart.classList.add("heart");

        heart.innerHTML =
            ["❤️","💖","💕","💗","💜"][
                Math.floor(
                    Math.random() * 5
                )
            ];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (Math.random() * 3 + 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {

            heart.remove();

        },6000);

    },700);
}

</script>

</body>
</html>
